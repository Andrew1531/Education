openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: institutions
    description: Public, source-backed institution verification
paths:
  /webhooks/resend:
    post:
      operationId: receiveResendDeliveryEvent
      description: Provider-only raw-body endpoint authenticated with Svix headers, not user tokens.
      parameters:
        - { in: header, name: svix-id, required: true, schema: { type: string } }
        - { in: header, name: svix-timestamp, required: true, schema: { type: string } }
        - { in: header, name: svix-signature, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendDeliveryEvent" }
      responses:
        "200": { description: Authenticated event recorded or ignored }
        "400": { description: Invalid signature or payload }
        "503": { description: Signing secret or database unavailable }
  /auth/schools/contacts:
    post:
      operationId: reviewSchoolContacts
      summary: Verify official recipients and preview the exact server-held profile
      parameters:
        - { in: header, name: x-auth-token, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolContactsInput" }
      responses:
        "200":
          description: Official contacts and a signed, expiring preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolReview" }
        "401": { description: Invalid owner token }
        "403": { description: Purpose disallowed or school not saved }
        "429": { description: Discovery rate limited }
  /auth/school-outreach:
    post:
      operationId: sendReviewedSchoolOutreach
      summary: Send only the explicitly consented, unchanged preview to reverified recipients
      parameters:
        - { in: header, name: x-auth-token, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolOutreachInput" }
      responses:
        "200":
          description: Per-recipient acceptance, rejection, or unknown outcomes, not delivery confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolOutreachResponse" }
        "401": { description: Invalid owner token }
        "409": { description: "Changed or expired preview, or request processing or unknown" }
        "503": { description: Required backend service unavailable }
  /auth/school-outreach-history:
    get:
      operationId: getSchoolOutreachHistory
      parameters:
        - { in: header, name: x-auth-token, required: true, schema: { type: string } }
        - { in: query, name: username, required: true, schema: { type: string } }
      responses:
        "200":
          description: The authenticated owner's recorded outcomes
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/SchoolOutreachOutcome" }
        "401": { description: Invalid owner token }
  /auth/profile:
    post:
      operationId: saveEducationProfile
      summary: Save the authenticated owner's education profile
      parameters:
        - in: header
          name: x-auth-token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EducationProfileInput" }
      responses:
        "200":
          description: Profile saved
        "400":
          description: Invalid profile
        "401":
          description: Invalid owner token
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /institutions/verify:
    post:
      operationId: verifyInstitution
      tags: [institutions]
      summary: Check an institution against public non-government sources
      description: Uses Wikidata, Wikipedia, and (for reported closures) Internet Archive. It does not determine accreditation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionVerificationRequest"
      responses:
        "200":
          description: Verification result, including honest ambiguous and not-found states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstitutionVerificationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Public evidence providers unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ResendDeliveryEvent:
      type: object
      required: [type, created_at, data]
      properties:
        type: { type: string }
        created_at: { type: string }
        data:
          type: object
          required: [email_id]
          properties:
            email_id: { type: string }
    SchoolContactsInput:
      type: object
      required: [username, schoolIds]
      properties:
        username: { type: string }
        schoolIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: Stable official program IDs or preserved numeric legacy school IDs
          items: { type: string }
    SchoolRecipient:
      type: object
      required: [email, sourceUrl]
      properties:
        email: { type: string }
        sourceUrl: { type: string }
    SchoolContact:
      type: object
      required: [schoolId, schoolName, status, recipients, fallbackUrl]
      properties:
        schoolId: { type: string }
        schoolName: { type: [string, "null"] }
        status: { type: string, enum: [verified, fallback, unavailable] }
        recipients:
          type: array
          items: { $ref: "#/components/schemas/SchoolRecipient" }
        fallbackUrl: { type: [string, "null"] }
        error: { type: string }
    SchoolOutreachPreview:
      type: object
      required: [text, token, expiresAt]
      properties:
        text: { type: string }
        token: { type: string }
        expiresAt: { type: number }
    SchoolReview:
      type: object
      required: [contacts, preview]
      properties:
        contacts:
          type: array
          items: { $ref: "#/components/schemas/SchoolContact" }
        preview: { $ref: "#/components/schemas/SchoolOutreachPreview" }
    SchoolOutreachSelection:
      type: object
      required: [schoolId, email]
      properties:
        schoolId: { type: string }
        email: { type: string }
    SchoolOutreachInput:
      type: object
      required: [username, requestId, schools, consent, preview]
      properties:
        username: { type: string }
        requestId: { type: string, minLength: 16, maxLength: 100 }
        schools:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/SchoolOutreachSelection" }
        consent: { type: boolean, enum: [true] }
        preview: { $ref: "#/components/schemas/SchoolOutreachPreview" }
    SchoolOutreachOutcome:
      type: object
      required: [schoolId, schoolName, recipient, recipientSourceUrl, result, sentAt]
      properties:
        schoolId: { type: string }
        schoolName: { type: string }
        recipient: { type: string }
        recipientSourceUrl: { type: string }
        result: { type: string, enum: [sent, failed, unknown, not_attempted] }
        sentAt: { type: string }
        packageVersion: { type: string }
        providerMessageId: { type: [string, "null"] }
        deliveryStatus: { type: string, enum: [delivered, bounced, complained, failed, delayed] }
        deliveryUpdatedAt: { type: string }
    SchoolOutreachResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/SchoolOutreachOutcome" }
        meaning: { type: string }
        historySaved: { type: boolean }
    EducationProfileInput:
      type: object
      required: [username, profile]
      properties:
        username: { type: string, minLength: 1 }
        profile: { $ref: "#/components/schemas/EducationProfile" }
    EducationProfile:
      type: object
      properties:
        country: { type: string, maxLength: 300 }
        institution: { type: string, maxLength: 300 }
        degree: { type: string, maxLength: 300 }
        field: { type: string, maxLength: 300 }
        purpose: { type: string, maxLength: 300 }
        qualifications:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Qualification" }
    Qualification:
      type: object
      required: [id, awardName, institution, country, field, duration, completion, awardType, evidenceStatus]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        awardName: { type: string, maxLength: 300 }
        institution: { type: string, maxLength: 300 }
        country: { type: string, maxLength: 300 }
        field: { type: string, maxLength: 300 }
        duration: { type: string, maxLength: 300 }
        completion:
          type: string
          enum: [completed, in_progress, not_completed, unknown]
        awardType:
          type: string
          enum: [academic, professional, unknown]
        evidenceStatus:
          type: string
          enum: [not_checked, corroborated, not_found, ambiguous, unavailable]
        verification: { $ref: "#/components/schemas/InstitutionVerificationResponse" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    InstitutionVerificationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        country:
          type: string
          minLength: 2
          maxLength: 100
        selectedEntityId:
          type: string
          pattern: "^Q[1-9][0-9]*$"
      required: [name, country]
    EvidenceSource:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        retrievedAt: { type: string, format: date-time }
      required: [name, url, retrievedAt]
    InstitutionCandidate:
      type: object
      properties:
        entityId: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        aliases:
          type: array
          items: { type: string }
        country: { type: [string, "null"] }
        countryMatch: { type: boolean }
        higherEducationType: { type: [string, "null"] }
        officialWebsite: { type: [string, "null"] }
        websiteAvailability:
          type: string
          enum: [not_checked]
        closureDate: { type: [string, "null"] }
        wikipediaUrl: { type: [string, "null"] }
        archiveUrl: { type: [string, "null"] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/EvidenceSource" }
      required: [entityId, name, description, aliases, country, countryMatch, higherEducationType, officialWebsite, websiteAvailability, closureDate, wikipediaUrl, archiveUrl, sources]
    InstitutionVerificationResponse:
      type: object
      properties:
        status:
          type: string
          enum: [verified, ambiguous, not_found]
        message: { type: string }
        accreditationChecked:
          type: boolean
          const: false
        selected:
          oneOf:
            - $ref: "#/components/schemas/InstitutionCandidate"
            - type: "null"
        candidates:
          type: array
          items: { $ref: "#/components/schemas/InstitutionCandidate" }
        retrievedAt: { type: string, format: date-time }
      required: [status, message, accreditationChecked, selected, candidates, retrievedAt]

