<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VerifED Global</title>
  <script>
    // Single-page app routing for GitHub Pages.
    // When GH Pages hits a 404 on a deep link (e.g. /Education/about),
    // this script encodes the path into a query string and redirects to the
    // repo root so the React router can handle it.
    // Strategy: keep 1 path segment (the repo name "Education").
    var segmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/')
        .replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>Redirecting…</body>
</html>
